[package]
name = "fritzdecode"
version = "0.4.1"
description = "Tools for working with AVM FritzBox config file exports"
edition = "2021"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = ["xiretza", "sovking <sovking@gmail.com>"]
repository = "https://github.com/sovking/fritzdecode"
homepage = "https://github.com/sovking/fritzdecode"

[dependencies]
aes = "0.8.2"
cbc = { version = "0.1.2", features = ["std"] }
clap = { version = "4.0.32", features = ["derive"] }
clap_complete = "4.0"
color-eyre = "0.6.2"
crc = "3.0.0"
data-encoding = "2.3.2"
encoding_rs = "0.8"
hex = "0.4.3"
md-5 = "0.10.5"
rand = "0.8.5"
regex = "1.7.0"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0.37"
