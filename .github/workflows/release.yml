name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: fritzdecode
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: fritzdecode
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: fritzdecode
            archive_ext: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: fritzdecode
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: fritzdecode
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: fritzdecode.exe
            archive_ext: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          PKG_NAME="fritzdecode-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$PKG_NAME/"
          cp README.md LICENSE "$PKG_NAME/"
          tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          PKG_NAME="fritzdecode-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$PKG_NAME/"
          cp README.md LICENSE "$PKG_NAME/"
          7z a "${PKG_NAME}.zip" "$PKG_NAME"
          shasum -a 256 "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            fritzdecode-*.tar.gz
            fritzdecode-*.tar.gz.sha256
            fritzdecode-*.zip
            fritzdecode-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
